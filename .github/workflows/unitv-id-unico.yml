name: UniTV - alternativa com recuperacao automatica
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unitv-id-unico.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unitv-id-unico-release
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixar entrada e ferramentas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download 1.0.0.1 --repo "$GITHUB_REPOSITORY" --pattern UniTV-5.9.0-teste-atualizacao-mac.apk --dir work
          mv work/UniTV-5.9.0-teste-atualizacao-mac.apk work/original.apk
          curl -fLsS https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o work/apktool.jar
          curl -fLsS https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o work/signer.jar
          echo '06840eb065080381d740f3cf5cc7c24d5121da7b5ba0d2f9eb6d09fb11894765  work/original.apk' | sha256sum -c -
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  work/apktool.jar' | sha256sum -c -
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  work/signer.jar' | sha256sum -c -
      - name: Aplicar alteracao e compilar (sem testes)
        run: |
          java -jar work/apktool.jar d -r -f work/original.apk -o work/decoded
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          base = Path('work/decoded')
          hashes = {str(p.relative_to(base)): hashlib.sha256(p.read_bytes()).hexdigest() for p in base.rglob('*') if p.is_file()}
          Path('work/source-before.json').write_text(json.dumps(hashes))
          PY
          (cd work/decoded && patch -p1 < ../../unitv-local/checagem-local.patch)
          (cd work/decoded && patch -p1 < ../../unitv-expiry/validade-local.patch)
          (cd work/decoded && patch -p1 < ../../unitv-autorefresh/autorefresh.patch)
          python3 unitv-autorefresh/build_helper.py unitv-autorefresh/SilentRefresh.java work/apktool.jar work/decoded work/helper-build
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          base = Path('work/decoded')
          before = json.loads(Path('work/source-before.json').read_text())
          after = {str(p.relative_to(base)): hashlib.sha256(p.read_bytes()).hexdigest() for p in base.rglob('*') if p.is_file()}
          changed = sorted(p for p in set(before) | set(after) if before.get(p) != after.get(p))
          expected = sorted([
              'smali/com/module/basemvp/a.smali',
              'smali/xc/a1$c.smali',
              'smali/tc/a.smali',
              'smali/yb/h.smali',
              'smali_classes2/ze/c.smali',
              'smali/s8/k1.smali',
              'smali/v9/c.smali',
              'smali/com/main/ui/activity/HomeActivity.smali',
              'smali/com/interactive/brasiliptv/app/LocalSessionPolicy.smali',
          ])
          helpers = [p for p in changed if p.startswith('smali/com/interactive/brasiliptv/app/SilentRefresh') and p.endswith('.smali')]
          if not helpers or sorted(p for p in changed if p not in helpers) != expected:
              raise SystemExit('Unexpected source changes: ' + repr(changed))
          report = {
              'base_asset': 'UniTV-5.9.0-teste-atualizacao-mac.apk',
              'base_sha256': hashlib.sha256(Path('work/original.apk').read_bytes()).hexdigest(),
              'patch': 'unitv-local/checagem-local.patch',
              'patch_sha256': hashlib.sha256(Path('unitv-local/checagem-local.patch').read_bytes()).hexdigest(),
              'modified_source_files': changed,
              'additional_patch': 'unitv-expiry/validade-local.patch',
              'additional_patch_sha256': hashlib.sha256(Path('unitv-expiry/validade-local.patch').read_bytes()).hexdigest(),
              'earlier_mac_or_30_second_network_patches_applied': False,
              'autorefresh_patch_sha256': hashlib.sha256(Path('unitv-autorefresh/autorefresh.patch').read_bytes()).hexdigest(),
              'autorefresh_source_sha256': hashlib.sha256(Path('unitv-autorefresh/SilentRefresh.java').read_bytes()).hexdigest(),
              'application_tests_executed': False,
          }
          Path('work/ORIGEM-autorefresh.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          java -jar work/apktool.jar b work/decoded -o work/rebuilt.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('work/original.apk') as src, zipfile.ZipFile('work/id-unico-unsigned.apk', 'w') as dst:
              for info in src.infolist():
                  n = info.filename
                  if n.startswith('META-INF/') and (n.upper().endswith(('.SF', '.RSA', '.DSA', '.EC')) or n.upper() == 'META-INF/MANIFEST.MF'):
                      continue
                  data = Path('work/decoded/build/apk', n).read_bytes() if n in ('classes.dex', 'classes2.dex') else src.read(n)
                  dst.writestr(info, data)
          PY
      - name: Assinar e preparar arquivos
        run: |
          java -jar work/signer.jar -a work/id-unico-unsigned.apk -o work/signed
          mkdir -p work/release
          cp work/signed/id-unico-aligned-debugSigned.apk work/release/UniTV-5.9.0-autorefresh-alternativo.apk
          cp unitv-autorefresh/LEIA-ME-autorefresh.txt unitv-autorefresh/autorefresh.patch work/release/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          output = Path('work/release/UniTV-5.9.0-autorefresh-alternativo.apk')
          def is_signature(n):
              u = n.upper()
              return u.startswith('META-INF/') and (u.endswith(('.SF', '.RSA', '.DSA', '.EC')) or u == 'META-INF/MANIFEST.MF')
          with zipfile.ZipFile('work/original.apk') as a, zipfile.ZipFile(output) as b:
              ah = {n: hashlib.sha256(a.read(n)).hexdigest() for n in a.namelist() if not is_signature(n)}
              bh = {n: hashlib.sha256(b.read(n)).hexdigest() for n in b.namelist() if not is_signature(n)}
          changed = sorted(n for n in set(ah) | set(bh) if ah.get(n) != bh.get(n))
          if changed != ['classes.dex', 'classes2.dex']:
              raise SystemExit('Unexpected APK content changes: ' + repr(changed))
          report = json.loads(Path('work/ORIGEM-autorefresh.json').read_text())
          report['modified_apk_entries_excluding_signatures'] = changed
          report['output_sha256'] = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('work/release/ORIGEM-autorefresh.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          (cd work/release && sha256sum *.apk > SHA256-autorefresh.txt)
      - name: Publicar na release indicada pelo usuario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload 1.0.0.1 work/release/UniTV-5.9.0-autorefresh-alternativo.apk work/release/LEIA-ME-autorefresh.txt work/release/autorefresh.patch work/release/SHA256-autorefresh.txt work/release/ORIGEM-autorefresh.json --repo "$GITHUB_REPOSITORY" --clobber
# Build revision: remote-session-triggers
