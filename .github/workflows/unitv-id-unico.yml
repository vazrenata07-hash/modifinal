name: UniTV - checagem local de sessao
on:
  push:
    paths:
      - '.github/workflows/unitv-id-unico.yml'
      - 'unitv-local/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unitv-id-unico-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixar entrada e ferramentas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download 1.0.0.1 --repo "$GITHUB_REPOSITORY" --pattern UniTV-5.9.0-teste-atualizacao-mac.apk --dir work
          mv work/UniTV-5.9.0-teste-atualizacao-mac.apk work/original.apk
          curl -fLsS https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o work/apktool.jar
          curl -fLsS https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o work/signer.jar
          echo '06840eb065080381d740f3cf5cc7c24d5121da7b5ba0d2f9eb6d09fb11894765  work/original.apk' | sha256sum -c -
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  work/apktool.jar' | sha256sum -c -
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  work/signer.jar' | sha256sum -c -
      - name: Aplicar alteracao e compilar (sem testes)
        run: |
          java -jar work/apktool.jar d -r -f work/original.apk -o work/decoded
          (cd work/decoded && patch -p1 < ../../unitv-local/checagem-local.patch)
          java -jar work/apktool.jar b work/decoded -o work/rebuilt.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('work/original.apk') as src, zipfile.ZipFile('work/id-unico-unsigned.apk', 'w') as dst:
              for info in src.infolist():
                  n = info.filename
                  if n.startswith('META-INF/') and (n.upper().endswith(('.SF', '.RSA', '.DSA', '.EC')) or n.upper() == 'META-INF/MANIFEST.MF'):
                      continue
                  data = Path('work/decoded/build/apk/classes.dex').read_bytes() if n == 'classes.dex' else src.read(n)
                  dst.writestr(info, data)
          PY
      - name: Assinar e preparar arquivos
        run: |
          java -jar work/signer.jar -a work/id-unico-unsigned.apk -o work/signed
          mkdir -p work/release
          cp work/signed/id-unico-aligned-debugSigned.apk work/release/UniTV-5.9.0-checagem-local.apk
          cp unitv-local/LEIA-ME-checagem-local.txt unitv-local/checagem-local.patch work/release/
          (cd work/release && sha256sum *.apk > SHA256-checagem-local.txt)
      - name: Publicar na release indicada pelo usuario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload 1.0.0.1 work/release/UniTV-5.9.0-checagem-local.apk work/release/LEIA-ME-checagem-local.txt work/release/checagem-local.patch work/release/SHA256-checagem-local.txt --repo "$GITHUB_REPOSITORY" --clobber
